name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run repository integrity & version checks
        run: npm run check

      - name: Run automated test suite
        run: npm test

      - name: Verify release build package
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build-release.ps1

